[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codonyat"
version = "1.2.1"
description = "codon-yat — A codon-aware (Yet Another) amino acid variant typer from SAM alignments of viral NGS data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Marc Noguera Julian", email = "info@treetopunder.com"}]
dependencies = [
    "biopython>=1.79,<2.1",
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]

[tool.setuptools.packages.find]
include = ["aa_caller*"]

[project.urls]
"Source" = "https://github.com/mnoguera/codonyat"
"Documentation" = "https://mnoguera.github.io/codonyat/"
"Issues" = "https://github.com/mnoguera/codonyat/issues"
"Nextflow pipeline (nf-codonyat)" = "https://github.com/sjoclaudi/nf-codonyat"

[project.scripts]
codonyat = "aa_caller.cli:main"
codonyat-runner = "aa_caller.runner:runner_cli"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B007", "F404", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
