name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov
      - name: Lint with ruff
        run: |
          ruff check . --fix  # auto-fix fixable errors (imports, trailing newlines, etc.)
          ruff check .        # fail if unresolved issues remain
      - name: Run tests with coverage
        run: python -m pytest --cov=aa_caller --cov-fail-under=80 --cov-report=term-missing
